name: Build Tweak (.deb & .dylib)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Theos Manually
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks
          brew install ldid dpkg
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build Package (.deb & .dylib)
        run: |
          echo "Kompilyasiya başladılır..."
          make package FINALPACKAGE=1
          
          echo "Yaranmış fayllar yoxlanılır..."
          find . -name "*.deb" -o -name "*.dylib"

      - name: Upload Artifacts (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tweak-deb
          path: packages/*.deb
