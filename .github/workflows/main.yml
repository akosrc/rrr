name: Build Deb and Dylib to Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # İstersen elle de başlatabilmen için

jobs:
  build:
    runs-on: macos-latest # iOS/Mac projeleri için macOS daha uyumludur

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Theos Kurulumu
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Derleme Yap (Hata olsa bile devam et)
      run: |
        make clean || true
        make || true
      continue-on-error: true

    - name: Deb ve Dylib Dosyalarını Topla ve ZIP Yap
      run: |
        mkdir -p Cikti
        # .deb dosyasını ara ve bul
        find . -name "*.deb" -exec cp {} Cikti/ \;
        # .dylib dosyasını ara ve bul
        find . -name "*.dylib" -exec cp {} Cikti/ \;
        
        # Toplanan dosyaları ZIP'le
        cd Cikti
        if [ "$(ls -A .)" ]; then
          zip -r ../Sonuclar.zip .
        else
          echo "Derleme başarısız olduğu için deb veya dylib bulunamadı." > ../Sonuclar.zip
        fi
      continue-on-error: true

    - name: ZIP Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Proje-Ciktisi-Zip
        path: Sonuclar.zip
