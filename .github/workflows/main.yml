name: Build and Upload Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. Depoyu Klonla
      uses: actions/checkout@v4

    - name: 2. Theos Kurulumu (Eksik Vendor Klasorleri Ile)
      run: |
        export THEOS=$HOME/theos
        mkdir -p $THEOS
        
        # 1. Theos'un ana dosyalarini indir
        curl -L https://github.com/theos/theos/archive/refs/heads/master.zip -o theos.zip
        unzip -q theos.zip
        mv theos-master/* $THEOS
        rm -rf theos.zip theos-master
        
        # 2. Eksik olan vendor/include klasorunu indir
        mkdir -p $THEOS/vendor
        curl -L https://github.com/theos/headers/archive/refs/heads/master.zip -o headers.zip
        unzip -q headers.zip
        mv headers-master $THEOS/vendor/include
        rm -rf headers.zip
        
        # 3. Eksik olan vendor/lib klasorunu indir
        curl -L https://github.com/theos/lib/archive/refs/heads/master.zip -o lib.zip
        unzip -q lib.zip
        mv lib-master $THEOS/vendor/lib
        rm -rf lib.zip
        
        # 4. dm.pl aracini indir (deb icin gerekliydi ama yine de garanti olsun)
        curl -L https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o $THEOS/bin/dm.pl
        chmod +x $THEOS/bin/dm.pl
        
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: 3. Sadece Dylib Derle (Deb Yok)
      run: |
        make clean || true
        make

    - name: 4. Sadece Dylib Dosyasini Indirme Butonu Icin Hazirla
      uses: actions/upload-artifact@v4
      with:
        name: Derlenen-Dylib
        path: "**/*.dylib"
        if-no-files-found: warn
