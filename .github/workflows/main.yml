name: Build Deb and Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # İstersen elle de başlatabilmen için

jobs:
  build:
    runs-on: macos-latest # iOS/Mac projeleri için macOS daha uyumludur

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Theos Kurulumu
      run: |
        export THEOS=$HOME/theos
        mkdir -p $THEOS
        # GitHub Actions'ta git clone hatası vermemesi için ZIP ile indiriyoruz
        curl -L https://github.com/theos/theos/archive/refs/heads/master.zip -o theos.zip
        unzip -q theos.zip
        mv theos-master/* $THEOS
        rm -rf theos.zip theos-master
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Derleme Yap (Hata olsa bile devam et)
      run: |
        make clean || true
        make package FINALPACKAGE=1 || true
      continue-on-error: true

    - name: Deb ve Dylib Dosyalarını Bul ve Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Derlenen-Dosyalar
        # Eğer derleme başarılıysa bulduğu tüm .deb ve .dylib dosyalarını GitHub'a yükler
        path: |
          **/*.deb
          **/*.dylib
