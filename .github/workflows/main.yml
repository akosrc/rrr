name: Build and Package

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. Depoyu Klonla
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 2. Theos Kurulumu
      run: |
        export THEOS=$HOME/theos
        mkdir -p $THEOS
        curl -L https://github.com/theos/theos/archive/refs/heads/master.zip -o theos.zip
        unzip -q theos.zip
        mv theos-master/* $THEOS
        rm -rf theos.zip theos-master
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: 3. Derleme Yap (Make)
      run: |
        make clean || true
        make package FINALPACKAGE=1
      continue-on-error: true

    - name: 4. Deb ve Dylib Dosyalarını Bul ve Tek Klasörde Topla
      run: |
        mkdir -p Cikti
        find . -name "*.dylib" -exec cp {} Cikti/ \;
        find . -name "*.deb" -exec cp {} Cikti/ \;
        
        cd Cikti
        # EĞER KLASÖR BOŞSA HATA VERMESİNİ ENGELLE
        if [ "$(ls -A .)" ]; then
          zip -r ../Sonuc.zip .
        else
          echo "Derleme basarisiz oldu. Hata mesajini Actions loglarindan kontrol edin." > ../Sonuc.zip
        fi

    - name: 5. Sonuc.zip Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Proje-Ciktisi
        path: Sonuc.zip
